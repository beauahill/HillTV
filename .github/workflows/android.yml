name: Build Android TV APK

# Builds the Google TV app in android/ and uploads the APK as a run artifact.
#
# It never publishes a release, on purpose. atvloadly follows this repo's
# releases and picks the Apple TV IPA out of each one by file name ("hilltv"),
# so another file in a release, or a release with no IPA in it, could stop
# the Apple TV's updates. Download the APK from the run's Artifacts instead.
#
# Signing. Without the secrets below, each run signs with a key made on that
# runner, so one build can't be installed over another: uninstall first.
# To get builds that update in place, make a keystore once and add these
# repo secrets (Settings > Secrets and variables > Actions > Secrets):
#   ANDROID_KEYSTORE_BASE64    the .jks file, base64 encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD       optional, defaults to the keystore password

on:
  push:
    branches: [main]
    # The phone page is kept in the Swift core and copied here; a test
    # holds the two equal, so a change to the Swift copy runs this too.
    paths: ["android/**", ".github/workflows/android.yml", "Packages/HillTVCore/Sources/HillTVCore/SyncPage.swift"]
  pull_request:
    # The phone page is kept in the Swift core and copied here; a test
    # holds the two equal, so a change to the Swift copy runs this too.
    paths: ["android/**", ".github/workflows/android.yml", "Packages/HillTVCore/Sources/HillTVCore/SyncPage.swift"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # The same 84 cases as the Swift core's tests, plus a few Android-only ones.
      - name: Test the core
        run: ./gradlew :core:test

      - name: Use the signing key, if one is set
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hilltv.jks"
          echo "HILLTV_KEYSTORE=$RUNNER_TEMP/hilltv.jks" >> "$GITHUB_ENV"

      - name: Build the APK
        env:
          HILLTV_VERSION_CODE: ${{ github.run_number }}
          HILLTV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HILLTV_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HILLTV_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Name the APK
        id: apk
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          name="HillTV-googletv-${version}-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "path=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
